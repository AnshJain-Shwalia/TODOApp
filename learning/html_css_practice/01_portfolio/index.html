<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimal Portfolio Link-in-Bio</title>
  <!-- Import Outfit font from Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Background glowing ornaments -->
  <div class="glow-bg glow-1"></div>
  <div class="glow-bg glow-2"></div>

  <div class="container">
    <header class="profile-header">
      <!-- A premium representation of an avatar profile image -->
      <div class="avatar-container">
        <div class="avatar-ring"></div>
        <div class="avatar-fallback">AG</div>
      </div>
      <h1 class="profile-name">Alex G.</h1>
      <p class="profile-tagline">Creative Frontend Developer & UI Designer</p>
    </header>

    <main class="links-section">
      <!-- Link Item 1 -->
      <a href="https://github.com" target="_blank" class="glass-card link-item">
        <span class="icon">💻</span>
        <span class="link-text">Explore My GitHub Repositories</span>
        <span class="arrow">→</span>
      </a>

      <!-- Link Item 2 -->
      <a href="https://dribbble.com" target="_blank" class="glass-card link-item">
        <span class="icon">🎨</span>
        <span class="link-text">Browse Creative Designs & Layouts</span>
        <span class="arrow">→</span>
      </a>

      <!-- Link Item 3 -->
      <a href="https://twitter.com" target="_blank" class="glass-card link-item">
        <span class="icon">🚀</span>
        <span class="link-text">Read My Tech Thoughts on Twitter</span>
        <span class="arrow">→</span>
      </a>
    </main>

    <footer class="profile-footer">
      <p class="copyright">© 2026 Alex G. Built with pure HTML & CSS.</p>
    </footer>
  </div>

</body>
</html>
